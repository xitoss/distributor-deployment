name: xitoss-distributor

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_prod:/var/lib/postgresql/data
      - ./backup:/workspace/backup
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/xitoss/distributor-app:latest  # from your GitHub package
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./license:/app/license/
      - ./processing:/app/processing
      - ./media:/app/media
      - static_volume:/app/staticfiles
      - ./version:/app/version
      - ./backup:/app/backup
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./media:/app/media
      - static_volume:/app/staticfiles
      - ./nginx/certbot:/var/www/certbot
      - ./processing:/deployment/processing
      - ./nginx/maintenance:/var/www/maintenance
      - ./nginx/safety_pages:/var/www/safety
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/certbot_entry.sh"]
    volumes:
      - ./nginx/certbot_entry.sh:/certbot_entry.sh
      - ./ssl:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot

  agent:
    build:
      context: .
      dockerfile: ./sys_scripts/Dockerfile.agent
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${AGENT_PORT:-6001}:${AGENT_PORT:-6001}"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
  
volumes:
  db_prod:
  static_volume: