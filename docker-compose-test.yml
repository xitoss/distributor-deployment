version: "3.8"
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./database:/var/lib/postgresql/data

  web:
    image: yourhubuser/distributor:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./media:/app/media
      - ./secret.txt:/app/secret.txt
      - ./license.pem:/app/license.pem
    ports:
      - "8000:8000"
