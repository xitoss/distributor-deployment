# ============================================
# Rate Limiting Zones
# ============================================
# - `conn_limit_per_ip` helps limit concurrent connections from one IP (WebSocket floods, many connections)
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# - `req_limit_per_ip` is the general flood limiter (throttles request rate)
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;

# - `req_limit_login` is reserved for auth endpoints (use tighter limits on /login)
limit_req_zone $binary_remote_addr zone=req_limit_login:10m rate=1r/s;

# - No limit zone for trusted endpoints (if needed)
limit_req_zone $binary_remote_addr zone=no_limit:1m rate=10000r/s;

# ============================================
# Security Maps
# ============================================
# Map suspicious user-agents to a flag so that can be blocked known scanners quickly.
# This helps reduce automated scanning (sqlmap/nikto) and some header-based probes.
map $http_user_agent $bad_ua {
    default 0;
    ~*(?:sqlmap|nikto|acunetix|masscan|nessus|dirbuster|fuzz|curl|wget|python-requests) 1;
}

# Suspicious request URIs to detect traversal and sensitive-file probing.
# When $bad_uri is set could be return 404 error.
map $request_uri $bad_uri {
    default 0;
    ~*(?:\.\./|/etc/passwd|/\.git/|\.env|wp-config\.php|/web\.config) 1;
}

# A simple geo/blocked_ip map, can be added manually, to prevent a specific IP address.
geo $blocked_ip {
    default 0;
    # Example: 192.168.1.100 1;
}

# ============================================
# Upstream Definition
# ============================================
upstream web {
    server web:8000;
    keepalive 16;
}

# ============================================
# Proxy Settings (Optional but Recommended)
# ============================================
# These settings optimize the connection to upstream
proxy_http_version 1.1;
proxy_set_header Connection "";  # Important for keepalive to work

# Buffer settings for better performance
proxy_buffering on;
proxy_buffer_size 4k;
proxy_buffers 8 4k;
proxy_busy_buffers_size 8k;

# Timeouts (adjust based on your app needs)
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;