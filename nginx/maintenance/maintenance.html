<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Temporarily Unavailable</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1a1d23;
            --text-main: #e0e0e0;
            --text-sub: #9aa0a6;
            --accent: #00bcd4;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: "Inter", "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        main {
            text-align: center;
            padding: 2.5rem;
            border-radius: 14px;
            background-color: var(--card-bg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
            max-width: 520px;
            width: 90%;
        }

        svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1.2rem;
            fill: var(--accent);
            animation: rotate 4s linear infinite;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
        }

        p {
            color: var(--text-sub);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <main>
        <!-- Simple animated gear icon -->
