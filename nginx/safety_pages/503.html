<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 503 - Service Unavailable</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1a1d23;
            --text-main: #e0e0e0;
            --text-sub: #9aa0a6;
            --accent: #00bcd4;
        }

        body {
            background-color: #0f1115;
            color: #f0f0f0;
            font-family: "Inter", "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        main {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            border: 1px solid #333;
            border-radius: 12px;
            background-color: #1a1d23;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.05);
        }

        h2 {
            font-weight: 500;
            margin-bottom: 1rem;
        }

        p {
            color: #bbb;
            line-height: 1.5;
        }

        svg {
            width: 64px;
            height: 64px;
            margin-bottom: 1.2rem;
            fill: var(--accent);
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-hourglass"
            viewBox="0 0 16 16">
            <path
                d="M2 1.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-1v1a4.5 4.5 0 0 1-2.557 4.06c-.29.139-.443.377-.443.59v.7c0 .213.154.451.443.59A4.5 4.5 0 0 1 12.5 13v1h1a.5.5 0 0 1 0 1h-11a.5.5 0 1 1 0-1h1v-1a4.5 4.5 0 0 1 2.557-4.06c.29-.139.443-.377.443-.59v-.7c0-.213-.154-.451-.443-.59A4.5 4.5 0 0 1 3.5 3V2h-1a.5.5 0 0 1-.5-.5m2.5.5v1a3.5 3.5 0 0 0 1.989 3.158c.533.256 1.011.791 1.011 1.491v.702c0 .7-.478 1.235-1.011 1.491A3.5 3.5 0 0 0 4.5 13v1h7v-1a3.5 3.5 0 0 0-1.989-3.158C8.978 9.586 8.5 9.052 8.5 8.351v-.702c0-.7.478-1.235 1.011-1.491A3.5 3.5 0 0 0 11.5 3V2z" />
        </svg>

        <h2>Error 503 — Service Unavailable</h2>
        <p>
            The system is currently unavailable or overloaded.
            Please try again shortly.
        </p>
    </main>

</body>

</html>
